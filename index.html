<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<title>Road to D1 — Jake's Training</title>
<style>
:root{
  --bg:#12100e; --panel:#1d1a16; --panel2:#26221c; --line:#3a352c;
  --volt:#c8f542; --orange:#ff7a1a; --maroon:#7a1f2b; --text:#f5f1e8; --muted:#a89f8d;
  --green:#57d977; --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;}
h1,h2,h3,.big{font-family:"Arial Narrow","Franklin Gothic Medium",Impact,system-ui,sans-serif;
  text-transform:uppercase;letter-spacing:.04em;margin:0}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 96px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#12100e 78%,rgba(18,16,14,0));
  padding:14px 0 8px}
.brand{display:flex;align-items:center;gap:12px}
.jersey{flex:0 0 auto;width:56px;height:56px;border-radius:12px;background:var(--maroon);
  border:2px solid var(--orange);display:flex;align-items:center;justify-content:center;
  font-family:Impact,sans-serif;font-size:26px;color:#fff;transform:rotate(-3deg)}
.brand h1{font-size:30px;line-height:.95}
.brand h1 .v{color:var(--volt)}
.brand .sub{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.14em;margin-top:3px}
.goalbar{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.goalbar .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.goalbar .row b{color:var(--text);font-size:13px}
.bar{height:12px;background:#0a0908;border-radius:99px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.bar > div{height:100%;background:linear-gradient(90deg,var(--orange),var(--volt));border-radius:99px;
  transition:width .8s cubic-bezier(.2,.9,.25,1)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0c0b09;border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:130px;background:transparent;border:0;color:var(--muted);
  font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding:9px 4px;border-radius:10px;font-weight:700}
nav.tabs button.on{background:var(--panel2);color:var(--volt)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:12px}
.card h2{font-size:20px}
.card h3{font-size:15px;color:var(--volt)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.hot{color:#12100e;background:var(--volt);border-color:var(--volt)}
.today-hero{background:linear-gradient(135deg,#2a1418, #1d1a16 55%, #23200f);border:1px solid var(--maroon)}
.today-hero .date{color:var(--orange);font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
.today-hero h2{font-size:27px;margin:4px 0 2px}
.today-hero p{color:var(--muted);margin:4px 0 0;font-size:14px}
.btn{display:inline-block;border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;
  text-transform:uppercase;letter-spacing:.06em;background:var(--volt);color:#12100e}
.btn.orange{background:var(--orange);color:#14100a}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.small{padding:9px 13px;font-size:13px}
.btn:disabled{opacity:.45}
.exrow{border-top:1px solid var(--line);padding:11px 0}
.exrow:first-of-type{border-top:0}
.exrow .nm{font-weight:800;font-size:16px}
.exrow .dt{color:var(--muted);font-size:13.5px;margin-top:2px;line-height:1.45;white-space:pre-line}
.exrow a.demo{color:var(--orange);font-size:12.5px;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
.sets{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.setdot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#0d0c0a;color:var(--muted);
  font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.setdot.done{background:var(--volt);border-color:var(--volt);color:#12100e}
.timer{display:none;margin-top:10px;background:#0d0c0a;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;align-items:center;justify-content:space-between}
.timer.show{display:flex}
.timer .t{font-family:Impact,sans-serif;font-size:26px;color:var(--volt);letter-spacing:.06em}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.cal-head h2{font-size:23px}
.cal-head button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;
  width:40px;height:40px;font-size:18px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal-grid .dow{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.1em;padding:3px 0}
.day{min-height:52px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 6px;
  text-align:left;color:var(--text);position:relative}
.day .n{font-weight:800;font-size:14px}
.day .k{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-top:2px;line-height:1.2}
.day .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%}
.day.done{background:#17301b;border-color:#2c5a33}
.day.done .n{text-decoration:line-through;color:var(--green)}
.day.today{outline:2px solid var(--orange)}
.day.empty{background:transparent;border:0}
.metric{border-top:1px solid var(--line);padding:11px 0}
.metric:first-of-type{border-top:0}
.metric .top{display:flex;justify-content:space-between;align-items:baseline}
.metric .nm{font-weight:800;font-size:15.5px}
.metric .nums{color:var(--muted);font-size:12.5px}
.metric .nums b{color:var(--volt);font-size:14px}
input[type=number],input[type=text],textarea{background:#0d0c0a;border:1px solid var(--line);border-radius:9px;
  color:var(--text);padding:9px 10px;font-size:15px;width:100%}
textarea{min-height:64px;resize:vertical}
label.lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;display:block;margin:10px 0 5px}
.streak{display:flex;gap:8px;align-items:stretch;margin-top:12px}
.streak .box{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center}
.streak .num{font-family:Impact,sans-serif;font-size:30px;color:var(--volt)}
.streak .cap{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.rules{color:var(--muted);font-size:14px;line-height:1.55}
.rules b{color:var(--text)}
ul.demos{list-style:none;margin:6px 0 0;padding:0}
ul.demos li{border-top:1px solid var(--line)}
ul.demos li:first-child{border-top:0}
ul.demos a{display:flex;justify-content:space-between;padding:11px 2px;color:var(--text);text-decoration:none;font-weight:700;font-size:15px}
ul.demos a span{color:var(--orange)}
.hidden{display:none}
.note{font-size:12.5px;color:var(--muted)}
.kbd{color:var(--volt);font-weight:800}

#player{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;padding:20px 16px 48px}
.bigset{font-size:60px;font-weight:900;letter-spacing:.5px;line-height:1.05}
.rbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:800;font-size:16px}
.rbtn.sel{background:var(--volt);color:#111;border-color:var(--volt)}
table.bench{width:100%;border-collapse:collapse;font-size:13.5px}
table.bench td,table.bench th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
table.bench td:first-child,table.bench th:first-child{text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="jersey">70</div>
      <div>
        <h1>ROAD TO <span class="v">D1</span></h1>
        <div class="sub">Jake Morris · Nose Guard · William Byrd · Class of 2030</div>
      </div>
    </div>
    <div class="goalbar">
      <div class="row"><span>2027 Preseason Goals — overall progress</span><b id="goalPct">0%</b></div>
      <div class="bar"><div id="goalFill" style="width:0%"></div></div>
    </div>
  </header>

  <main id="view-home"></main>
  <main id="view-cal" class="hidden"></main>
  <main id="view-progress" class="hidden"></main>
  <main id="view-meals" class="hidden"></main>
  <main id="view-playbook" class="hidden"></main>
</div>

<div id="player" class="hidden"></div>
<nav class="tabs">
  <button data-v="home" class="on">Today</button>
  <button data-v="cal">Calendar</button>
  <button data-v="progress">Progress</button>
  <button data-v="meals">Meals</button>
  <button data-v="playbook">Playbook</button>
</nav>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
/* ============ PROGRAM DATA ============ */
const TM0 = { squat: 437, bench: 255, clean: 255 }; // estimated training maxes until Dec testing
const BASE = { "2026-12":0.65,"2027-01":0.70,"2027-02":0.75,"2027-03":0.78,"2027-04":0.82,
               "2027-05":0.85,"2027-06":0.85,"2027-07":0.88,"2027-08":0.85 };
const SETS = { "2026-12":[4,5],"2027-01":[5,5],"2027-02":[5,4],"2027-03":[4,4],"2027-04":[4,3],
               "2027-05":[3,3],"2027-06":[4,3],"2027-07":[3,2],"2027-08":[3,2] };
const CLSETS = { "2026-12":[5,3],"2027-01":[5,3],"2027-02":[6,3],"2027-03":[6,2],"2027-04":[6,2],
                 "2027-05":[5,2],"2027-06":[6,2],"2027-07":[5,2],"2027-08":[5,2] };
const PHASE = { "2026-12":"Post-season recovery, then Base. Testing Dec 28-30.",
  "2027-01":"Winter Base — strength + mobility. Growth-spurt watch.",
  "2027-02":"Winter Base — strength + mobility.",
  "2027-03":"Spring — speed emphasis begins.",
  "2027-04":"Spring — speed + power.",
  "2027-05":"Spring — re-test combine numbers May 24-25.",
  "2027-06":"Summer — power + position skill. 1-2 college camps.",
  "2027-07":"Summer — power + conditioning ramp.",
  "2027-08":"Camp prep — peak. August targets on the line." };
const DEMO = {
  squat:"https://www.youtube.com/watch?v=gcNh17Ckjgg",
  bench:"https://www.youtube.com/watch?v=4Y2ZdHCOXok",
  clean:"https://www.youtube.com/watch?v=uFB9cDXAXU0",
  rdl:"https://www.youtube.com/watch?v=ysMo_VFN-dY",
  row:"https://www.youtube.com/watch?v=A1tmBJKKfVs",
  split:"https://www.youtube.com/watch?v=hiLF_pF3EJM",
  boxjump:"https://www.youtube.com/watch?v=YLPQsdRDmB0",
  medball:"https://www.youtube.com/watch?v=Jlwpf-0zsDQ",
  shuttle:"https://www.youtube.com/watch?v=qYDXaXRodWc",
  latbound:"https://www.youtube.com/watch?v=Hc9_FQgIeeg",
  cut:"https://www.youtube.com/watch?v=hv_r8ruozTM",
  wave:"https://www.youtube.com/watch?v=lqzuH_5QpM4",
  getoff:"https://www.youtube.com/watch?v=eDSkbjbtXyg",
  hands:"https://www.youtube.com/watch?v=KJHKKM4B1vo",
  carry:"https://www.youtube.com/watch?v=Kh0871u60z0",
  hip:"https://www.youtube.com/watch?v=E5BInrORfF8",
  lunge:"https://www.youtube.com/watch?v=mAgbXQdd4LM",
  buildup:"https://www.youtube.com/watch?v=L68v1RpIBEg",
  shuffle:"https://www.youtube.com/watch?v=315rgJ5uYsU",
  forty:"https://www.youtube.com/watch?v=rIlFj4TKvpI",
  shed:"https://www.youtube.com/watch?v=yc6VMLZlCDw",
  incline:"https://www.youtube.com/watch?v=PZecKOpWOrk",
  pulldown:"https://www.youtube.com/watch?v=SALxEARiMkw",
  facepull:"https://www.youtube.com/watch?v=0Po47vvj9g4",
  broadjump:"https://www.youtube.com/watch?v=uhz-ia-2UcM",
  core:"https://www.youtube.com/watch?v=6KNrG_U-RTw",
  repeats:"https://www.youtube.com/watch?v=rCnm_zMvbUA",
  sled:"https://www.youtube.com/watch?v=8UqhblFOMe8",
  bear:"https://www.youtube.com/watch?v=t8XLor7unqU",
  nordic:"https://www.youtube.com/watch?v=F-AaE8mw_pY" };
const METRICS = [
  {k:"squat", n:"Squat", u:"lb", base:405, est:"430-445", goal:475, stretch:500, up:1, w:14},
  {k:"bench", n:"Bench", u:"lb", base:235, est:"250-260", goal:280, stretch:295, up:1, w:9},
  {k:"clean", n:"Clean", u:"lb", base:235, est:"250-260", goal:280, stretch:295, up:1, w:13},
  {k:"ten", n:"10-yard", u:"sec", base:1.97, est:"", goal:1.85, stretch:1.80, up:0, w:15},
  {k:"forty", n:"40-yard", u:"sec", base:5.81, est:"", goal:5.55, stretch:5.40, up:0, w:6},
  {k:"shuttle", n:"Shuttle 5-10-5", u:"sec", base:5.29, est:"", goal:4.95, stretch:4.85, up:0, w:16},
  {k:"ldrill", n:"L-drill", u:"sec", base:8.96, est:"", goal:8.40, stretch:8.20, up:0, w:8},
  {k:"broad", n:"Broad jump", u:"in", base:83.7, est:"", goal:92, stretch:96, up:1, w:9},
  {k:"vert", n:"Vertical", u:"in", base:17.6, est:"", goal:22, stretch:24, up:1, w:10} ];

/* ============ STATE ============ */
const LS = "roadToD1.v1";
let S = JSON.parse(localStorage.getItem(LS) || "{}");
S.marks = S.marks || {};       // iso -> {done:1, where:"home"|"school", note:"", sets:{exIdx:[bool]}}
S.latest = S.latest || {};     // metric key -> latest value
S.tm = S.tm || {};             // overrides for training maxes
S.frame = S.frame || {};       // height, wingspan, weight
function save(){ S._u = Date.now(); localStorage.setItem(LS, JSON.stringify(S)); cloudPush(); }
function tm(lift){ return S.tm[lift] || TM0[lift]; }
const r5 = x => Math.round(x/5)*5;
const iso = d => d.toISOString().slice(0,10);
const key = d => iso(d).slice(0,7);
function wkOf(day){ return day<=7?1 : day<=14?2 : day<=21?3 : 4; }
function adjPct(base, wk){ return wk===4 ? [0.60,true] : [base+(wk-1)*0.025, false]; }

/* Flexible program start: the calendar (months, waves, testing days) was built around a
   Mon Nov 30, 2026 start (ORIGIN). S.progStart slides it — every date is translated to
   its program date before any lookup, so the whole program moves as one piece. */
const ORIGIN = "2026-11-30";
function progStart(){ const d = new Date((S.progStart || ORIGIN) + "T12:00:00"); return iso(weekMonday(d)); }
function progShift(){ return Math.round((new Date(ORIGIN + "T12:00:00") - new Date(progStart() + "T12:00:00")) / 86400000); }
function vdate(date){ const v = new Date(date); v.setDate(v.getDate() + progShift()); return v; }
function vkey(date){ return key(vdate(date)); }
function fmtD(isoStr){ return new Date(isoStr + "T12:00:00").toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric", year:"numeric"}); }

/* ============ SESSION GENERATION ============ */
function sessionFor(date){
  const realIso = iso(date);
  date = vdate(date);
  const k = key(date), day = date.getDate(), wd = date.getDay(); // 0 Sun
  const mon = date.getMonth();
  if(k==="2026-12" && day<=13) return {title:"Recovery Day", kind:"rest", ex:[
    {n:"Light movement", d:"20-30 min walk, easy mobility flow, foam roll. No lifting. Sleep and eat.", sets:0}]};
  if((k==="2026-12" && [28,29,30].includes(day)) || (k==="2027-05" && [24,25].includes(day)))
    return {title:"TESTING DAY", kind:"test", ex:[
      {n:"Jump & sprint tests", d:"Vertical x3, broad jump x3, 10-yd x3, shuttle x2 each way. Coach/adult present — no true 1RM attempts.", sets:0},
      {n:"Strength check", d:"Squat, bench, clean: clean sets of 3-5, add weight while form stays perfect. Last clean set estimates your max.", sets:0},
      {n:"Log it", d:"Enter every number in the Progress tab — the whole program recalculates from real maxes.", sets:0}]};
  if(k < "2026-12") return {title:"Season Mode — Program Starts " + fmtD(progStart()), kind:"rest", ex:[
    {n:"In-Season Maintenance", d:"Season is still on — team lifting only, no extra offseason work. Mobility flow 10 min (hips, ankles, T-spine), hit the fuel check, sleep 9 hours. The offseason program starts " + fmtD(progStart()) + " — if the season runs longer, move the start in Playbook \u2192 Program Start and everything slides with it.", sets:0, demo:"hip"}]};
  if(k > "2027-08") return {title:"Program Complete — Camp Mode", kind:"rest", ex:[
    {n:"Keep The Engine On", d:"Offseason program complete. Stay on the fuel check, mobility daily, and team work — and keep logging new numbers in Progress.", sets:0, demo:"hip"}]};
  const base = BASE[k]; if(base===undefined) return null;
  const wk = wkOf(day), [pct, deload] = adjPct(base, wk);
  const [ss, sr] = SETS[k], [cs, cr] = CLSETS[k];
  const rf = (realIso===iso(new Date()) && S.readiness && S.readiness[realIso]) ? readyFactorOf(S.readiness[realIso]) : 1;
  const sqW = r5(tm("squat")*pct*rf), beW = r5(tm("bench")*pct*rf), clW = r5(tm("clean")*pct*rf);
  const sN = deload? Math.max(3, ss-1) : ss, bN = sN, cN = deload? Math.max(3, cs-1) : cs;
  const plusTxt = deload? "Deload week — light and fast, leave fresh." :
    "Last set is a PLUS set: as many strong reps as you can with perfect form. Beat the target by 2+ and next month's max jumps.";
  const WARM = "Warm-up: bike/row 3 min, leg swings x10, bodyweight squats x10, band pull-aparts x15, then ramp sets.";
  const byDay = {
    1:{title:"Strength A — Squat Day", kind:"lift", ex:[
      {n:"Back Squat", d:`${WARM}\nRamp: 135x5, 185x3, 225x2 → Work: ${sN} sets x ${sr} reps @ ${sqW} lb. Rest 2-3 min. ${plusTxt}`, sets:sN, demo:"squat"},
      {n:"Romanian Deadlift", d:`3 sets x 8 reps @ ${r5(sqW*0.55)} lb`, sets:3, demo:"rdl"},
      {n:"Barbell / Chest-Supported Row", d:`3 sets x 10 reps @ ${r5(sqW*0.42)} lb`, sets:3, demo:"row"},
      {n:"Walking Lunges", d:"2 sets x 8 each leg, bodyweight or light DBs", sets:2, demo:"lunge"},
      {n:"Neck + Grip", d:"Neck work 2x15 light. Farmer hold 2x30 sec, heavy.", sets:2, demo:"carry"}]},
    2:{title:"Speed & Agility", kind:"speed", ex:[
      {n:"Warm-up", d:"Jog, high knees, A-skips, leg swings, karaoke (cross-over run) 2x15 yd each way, lateral shuffles 2x10 yd — 10 min.", sets:0},
      {n:"Stance-and-Start (10-yd)", d:"From your 3-point DL stance: 6 reps x 10 yd, walk back, full rest.", sets:6, demo:"getoff"},
      {n:"20-yd Buildups", d:"4 reps, smooth to fast.", sets:4, demo:"buildup"},
      {n:"5-10-5 Shuttle Practice", d:"4 reps (2 each direction). Low hips, plant foot outside.", sets:4, demo:"shuttle"},
      {n:"Lateral Bounds", d:"3 sets x 4 each side. Jump sideways off one leg, land on the other and STICK it — no wobble, no extra hop. Power sideways is what closes on a QB and beats a reach block.", sets:3, demo:"latbound"},
      {n:"90° Cut Sprints", d:"4 reps: sprint 10 yd, plant hard outside foot, cut 90° and burst 5 yd (2 left, 2 right). Hips low into the plant, head up out of it.", sets:4, demo:"cut"},
      {n:"Shuffle to Sprint", d:"4 reps: 5 yd lateral shuffle → 10 yd sprint.", sets:4, demo:"shuffle"},
      {n:"40-yd Relaxed-Fast", d:"2 reps. Quality only — if form falls apart, the day is over.", sets:2, demo:"forty"}]},
    3:{title:"DL Craft & Hands", kind:"craft", ex:[
      {n:"Stance-and-Start", d:"On a ball/snap count: 10 reps. First step 6 inches, low pad level.", sets:10, demo:"getoff"},
      {n:"Wave Drill — Lateral Steps", d:"4 x 15 sec: in your stance, quick lateral steps left-right-left on command (or alternate every 2 steps), staying LOW — no standing up, no crossing feet. This is pass-rush counter and down-the-line pursuit movement.", sets:4, demo:"wave"},
      {n:"Fit-and-Lockout Holds", d:"Vs a pad/partner: 5 x 5 sec at FULL arm extension. Use the 6'8\" wingspan.", sets:5, demo:"hands"},
      {n:"Stab-and-Rip", d:"6 each side: one-arm stab, rip through.", sets:6, demo:"hands"},
      {n:"Hand Fighting Mirror Rounds", d:"4 x 20 sec: club, chop, swipe — hands at arm's length.", sets:4, demo:"hands"},
      {n:"Shed-and-Pursue", d:"Engage, shed, sprint 10 yd at an angle: 6 reps.", sets:6, demo:"shed"},
      {n:"Mobility Finish", d:"90/90 hip switches x10, couch stretch 1 min/side, ankle rocks x10/side, thoracic openers x8.", sets:0, demo:"hip"}]},
    4:{title:"Strength B — Bench Day", kind:"lift", ex:[

      {n:"Incline DB Press", d:"3 sets x 10, heaviest DBs you control (start 40-50s).", sets:3, demo:"incline"},

      {n:"Face Pulls + Triceps", d:"Face pulls 2x15. Pushdowns 2x12.", sets:2, demo:"facepull"}]},
    5:{title:"Power Day", kind:"power", ex:[
      {n:"Hang Clean", d:`Warm-up: bike 3 min, A-skips, pogo hops x10, med-ball pass x5.\nRamp: 95x3, 135x2 → Work: ${cN} sets x ${cr} reps @ ${clW} lb. Fast and clean — ugly catch, drop 10 lb.`, sets:cN, demo:"clean"},
      {n:"Box Jumps", d:"4 sets x 3. Low box, step down, land soft and quiet.", sets:4, demo:"boxjump"},
      {n:"Med-Ball Throws", d:"Chest pass 4x4. Rotational throw 3x3 each side (10-14 lb ball).", sets:4, demo:"medball"},
      {n:"Broad Jump", d:"4 sets x 2. Stick the landing.", sets:4, demo:"broadjump"},
      {n:"Core", d:"Dead bugs 2x10. Side plank 2x30 sec each side.", sets:2, demo:"core"}]},
    6:{title:"Conditioning", kind:"cond", ex:[
      {n:"Repeat Sprints", d:"8 x 20 yd, walk back as rest (~30 sec). Full recovery before each rep.", sets:8, demo:"repeats"},
      {n:"Farmer Carries", d:"4 x 40 yd. Heaviest DBs you can grip without leaning (start 70-90 lb each hand).", sets:4, demo:"carry"},
      {n:"Sled Push / Hill Sprint", d:"4 x 15 yd (if available).", sets:4, demo:"sled"},
      {n:"Bear Crawl", d:"3 x 15 yd finisher.", sets:3, demo:"bear"}]},
    0:{title:"Rest Day", kind:"rest", ex:[
      {n:"Weigh In + Recover", d:"Morning: weigh yourself and log it in Progress (growth tracking — the number should creep UP slowly). Mobility flow 10 min (hips, ankles, T-spine), walk, eat big, sleep 9 hours. Growth happens today.", sets:0, demo:"hip"}]}
  };
  return byDay[wd];
}
</script>
<script>
/* ===== Readiness ===== */
let RD = {sleep:4, sore:4, energy:4};
function readyFactorOf(r){
  const avg = (r.sleep + r.sore + r.energy) / 3;
  if (avg >= 4.5) return 1;
  if (avg >= 3.5) return 0.975;
  if (avg >= 2.5) return 0.95;
  return 0.90;
}
function readyCardHTML(di){
  const sess = sessionFor(new Date(di + "T12:00:00"));
  if (!sess || sess.kind === "rest" || sess.kind === "test") return "";
  const r = S.readiness && S.readiness[di];
  if (r){
    const avg = ((r.sleep + r.sore + r.energy) / 3).toFixed(1);
    const f = readyFactorOf(r);
    return `<div class="card"><span class="tag ${f===1?"hot":""}">Readiness ${avg}/5</span>
      <h2 style="margin-top:8px">${f===1 ? "Green — full weights today" : "Main lifts scaled to " + Math.round(f*100) + "%"}</h2>
      <div class="note">Sleep ${r.sleep} · Freshness ${r.sore} (5 = fresh) · Energy ${r.energy}. Today's squat / bench / clean weights already reflect this.</div>
      <button class="btn small ghost" style="margin-top:10px" onclick="redoReady('${di}')">Redo check-in</button></div>`;
  }
  const row = (k2, label) => `<div style="display:flex;align-items:center;gap:8px;margin:8px 0">
    <div style="width:86px;font-weight:700;font-size:14px">${label}</div>
    ${[1,2,3,4,5].map(n=>`<button class="rbtn ${RD[k2]===n?"sel":""}" onclick="setRD('${k2}',${n})">${n}</button>`).join("")}</div>`;
  return `<div class="card" style="border-color:var(--orange)"><span class="tag hot">Before you train</span>
    <h2 style="margin-top:8px">Readiness Check — 30 Seconds</h2>
    <div class="note">How do you actually feel? Be honest — a scaled day you complete beats a hero day that buries you. Your answers set today's main-lift weights.</div>
    ${row("sleep","Sleep")}
    ${row("sore","Freshness")}
    ${row("energy","Energy")}
    <button class="btn" style="width:100%;margin-top:10px" onclick="saveReady('${di}')">Set Today's Weights</button></div>`;
}
function setRD(k, n){ RD[k] = n; renderHome(); }
function saveReady(di){ S.readiness = S.readiness || {}; S.readiness[di] = {...RD}; save(); renderHome(); }
function redoReady(di){ delete S.readiness[di]; save(); renderHome(); }

/* ===== Plates ===== */
function plateCalc(total){
  if (!total || total <= 45) return "bar only";
  let side = (total - 45) / 2; const out = [];
  [45,35,25,10,5,2.5].forEach(pl => { const c = Math.floor(side / pl); if (c > 0){ out.push(c + "×" + pl); side -= c * pl; } });
  return out.length ? out.join(" + ") : "bar only";
}
function plateOut(){ const v = parseFloat($("#plate-in").value); $("#plate-out").textContent = isNaN(v) ? "" : "Per side: " + plateCalc(v); }

/* ===== Embedded videos ===== */
const VID = { squat:"gcNh17Ckjgg", bench:"4Y2ZdHCOXok", clean:"uFB9cDXAXU0", rdl:"ysMo_VFN-dY", row:"A1tmBJKKfVs", split:"hiLF_pF3EJM", boxjump:"YLPQsdRDmB0", medball:"Jlwpf-0zsDQ", shuttle:"qYDXaXRodWc", latbound:"Hc9_FQgIeeg", cut:"hv_r8ruozTM", wave:"lqzuH_5QpM4", getoff:"eDSkbjbtXyg", hands:"KJHKKM4B1vo", carry:"Kh0871u60z0", hip:"E5BInrORfF8", lunge:"mAgbXQdd4LM", buildup:"L68v1RpIBEg", shuffle:"315rgJ5uYsU", forty:"rIlFj4TKvpI", shed:"yc6VMLZlCDw", incline:"PZecKOpWOrk", pulldown:"SALxEARiMkw", facepull:"0Po47vvj9g4", broadjump:"uhz-ia-2UcM", core:"6KNrG_U-RTw", repeats:"rCnm_zMvbUA", sled:"8UqhblFOMe8", bear:"t8XLor7unqU", nordic:"F-AaE8mw_pY" };
const VID_NAME = { "Nordic Curl Eccentrics":"F-AaE8mw_pY" };
function vidFor(e){ return VID[e.demo] || VID_NAME[e.n] || null; }
function toggleVid(e, id){
  e.preventDefault();
  const el = document.getElementById(id);
  if (el.innerHTML) { el.innerHTML = ""; return; }
  el.innerHTML = `<iframe width="100%" height="200" style="border:0;border-radius:10px;margin-top:8px" src="https://www.youtube-nocookie.com/embed/${el.dataset.vid}" allowfullscreen></iframe>`;
}

/* ===== School lifting: week plan + auto-adjust ===== */
const LIFT_EMPH = {1:"lower", 4:"upper", 5:"lower"};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function weekMonday(d){ const x = new Date(d); const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x; }
function schoolSessionsForWeek(anyDate){
  const mon = weekMonday(anyDate); const out = {};
  for (let i = 0; i < 7; i++){
    const dt = new Date(mon); dt.setDate(dt.getDate() + i); const di = iso(dt);
    if (S.schoolLog && S.schoolLog[di]) out[di] = S.schoolLog[di];
  }
  return out;
}
function plannedSchoolDays(anyDate){
  const mon = weekMonday(anyDate); const wk = iso(mon);
  const list = (S.schoolWeeks && S.schoolWeeks[wk]) || [];
  return new Set(list);
}
function plannedSchoolDay(di){ return plannedSchoolDays(new Date(di + "T12:00:00")).has(di); }
function weekOverrides(anyDate){
  const mon = weekMonday(anyDate);
  const days = []; for (let i = 0; i < 7; i++){ const dt = new Date(mon); dt.setDate(dt.getDate() + i); days.push(dt); }
  const SS = schoolSessionsForWeek(anyDate);
  const ov = {}; const usedSwap = new Set();
  days.forEach((dt, idx) => {
    const di = iso(dt); const sess = sessionFor(dt); if (!sess) return;
    const emph = LIFT_EMPH[dt.getDay()]; const myS = SS[di];
    if (myS && emph && (myS === emph || myS === "both") && (sess.kind === "lift" || sess.kind === "power")){
      ov[di] = { type:"covered", note:"Coach's program covers today's " + emph + " work — no double session. Fuel, mobility, done." };
      return;
    }
    if (myS && emph && myS !== emph && myS !== "both"){
      ov[di] = { type:"note", note:"School lifted " + myS + " today — this " + emph + " session still stands. Eat, hydrate, get after it." };
      return;
    }
    if (myS && !emph){
      ov[di] = { type:"note", note:"School lifting today (" + myS + ") plus this session — keep this one technical and fresh." + (((myS === "lower" || myS === "both") && (sess.kind === "speed" || sess.kind === "cond")) ? " Cut sprint volume in half." : "") };
      return;
    }
    if (!myS && plannedSchoolDays(anyDate).has(di)){
      ov[di] = { type:"note", note: emph
        ? "Team lifting today (planned). If the team works the same muscles as this session, do theirs, then cross the day off with the school button and pick upper/lower — the rest of the week reshuffles from what actually happened. If they worked the other half, this session still stands."
        : "Team lifting today (planned) plus this session. After the team session, log upper/lower with the school cross-off and the week adjusts from there." };
      return;
    }
    if (emph && idx > 0){
      const ys = SS[iso(days[idx-1])];
      if (ys && (ys === emph || ys === "both")){
        let cand = null;
        for (let j = idx + 1; j < 7; j++){
          const cdt = days[j]; const cs = sessionFor(cdt); if (!cs) continue;
          const cemph = LIFT_EMPH[cdt.getDay()];
          if (cemph && cemph !== emph && !ov[iso(cdt)] && !usedSwap.has(iso(cdt)) && !SS[iso(cdt)]){ cand = cdt; break; }
        }
        if (cand){
          ov[di] = { type:"swap", with: iso(cand), note:"School lifted " + emph + " yesterday, so this session swapped with " + cand.toLocaleDateString("en-US",{weekday:"long"}) + " — your " + emph + " work gets a recovery day." };
          ov[iso(cand)] = { type:"swap", with: di, note:"Swapped with " + dt.toLocaleDateString("en-US",{weekday:"long"}) + " — school lifting shifted this week." };
          usedSwap.add(iso(cand));
        } else {
          ov[di] = { type:"light", note:"School lifted " + emph + " yesterday — technique day: main lift at ~55% of the listed weight, perfect form, no plus set." };
        }
      }
    }
  });
  return ov;
}
function plannedFor(date){
  const base = sessionFor(date); if (!base) return base;
  const di = iso(date);
  const ov = weekOverrides(date)[di];
  if (!ov) return base;
  if (ov.type === "covered"){
    const SS = schoolSessionsForWeek(date); const t = SS[di] || "lower";
    return { title:"School Lifting — " + (t === "both" ? "Full Body" : cap(t) + " Body"), kind:"school", adjNote: ov.note, ex:[
      { n:"Covered at school", d:"Coach's " + t + "-body session replaces today's app workout. When it's done, cross this day off with the school button below.", sets:0 },
      { n:"Mobility Finish", d:"90/90 hip switches x10, couch stretch 1 min/side, ankle rocks x10/side. 10 min, easy.", sets:0, demo:"hip" }] };
  }
  if (ov.type === "swap"){
    const s2 = sessionFor(new Date(ov.with + "T12:00:00"));
    return Object.assign({}, s2, { adjNote: ov.note });
  }
  if (ov.type === "light"){
    const clone = Object.assign({}, base, { adjNote: ov.note, ex: base.ex.map((e, i) => i === 0 ? Object.assign({}, e, { d: "TECHNIQUE DAY — use ~55% of the listed weight, no plus set.\n" + e.d }) : e) });
    return clone;
  }
  return Object.assign({}, base, { adjNote: ov.note });
}
function schoolAsk(di){ const el = document.getElementById("school-" + di); if (el) el.style.display = "flex"; }
function crossOffSchool(di, type){
  const mk = ensureMark(di); mk.done = 1; mk.where = "school"; mk.schoolType = type;
  S.schoolLog = S.schoolLog || {}; S.schoolLog[di] = type;
  saveNoteVal(di); save(); rerender(); refreshGoal();
}
let SP = null;
function schoolWeekCard(){
  const mon = weekMonday(new Date());
  const wkKey = iso(mon);
  if (S.schoolWeeks && S.schoolWeeks[wkKey]) return "";
  if (!SP){
    SP = {};
    const prevMon = new Date(mon); prevMon.setDate(prevMon.getDate() - 7);
    const prev = (S.schoolWeeks && S.schoolWeeks[iso(prevMon)]) || [];
    const prevOffsets = new Set(prev.map(di => { const d = new Date(di + "T12:00:00"); return (d.getDay() + 6) % 7; }));
    for (let i = 0; i < 5; i++){
      const dt = new Date(mon); dt.setDate(dt.getDate() + i);
      SP[iso(dt)] = prevOffsets.has(i);
    }
  }
  const rows = [];
  for (let i = 0; i < 5; i++){
    const dt = new Date(mon); dt.setDate(dt.getDate() + i); const di = iso(dt);
    rows.push(`<div style="display:flex;align-items:center;gap:8px;margin:7px 0">
      <div style="width:110px;font-weight:700;font-size:14px">${dt.toLocaleDateString("en-US",{weekday:"short", month:"numeric", day:"numeric"})}</div>
      <button class="rbtn ${SP[di]?"sel":""}" style="width:auto;padding:0 14px;height:38px;font-size:13px" onclick="setSP('${di}')">${SP[di] ? "✓ Lifting with team" : "Not lifting"}</button></div>`);
  }
  return `<div class="card"><span class="tag">Start of week</span>
    <h2 style="margin-top:8px">School Lifting This Week</h2>
    <div class="note">Which days is he lifting with the team this week? Upper/lower doesn't get decided ahead of time — just mark the days. After each team session he logs what they actually did (upper/lower) with the school cross-off, and the rest of the week reshuffles itself. Hit save and this card goes away until next week — it'll come back with these same days filled in, so if nothing changed he just hits save again.</div>
    ${rows.join("")}
    <button class="btn" style="width:100%;margin-top:10px" onclick="saveSchoolWeek()">Save This Week</button></div>`;
}
function setSP(di){ SP[di] = !SP[di]; renderHome(); }
function saveSchoolWeek(){
  const mon = weekMonday(new Date()); const wkKey = iso(mon);
  S.schoolWeeks = S.schoolWeeks || {};
  S.schoolWeeks[wkKey] = Object.keys(SP).filter(di => SP[di]).sort();
  save(); SP = null; renderHome(); renderCal();
}

/* ===== Guided workout player + set logging ===== */
let PL = null, plTimer = null;
function parseW(e){ const m = (e.d || "").match(/@ (\d+) lb/); return m ? parseInt(m[1]) : 0; }
function parseReps(e){
  let m = (e.d || "").match(/sets x (\d+) reps/); if (m) return { reps: parseInt(m[1]), plus: /PLUS set/.test(e.d) };
  m = (e.d || "").match(/x (\d+) reps/); if (m) return { reps: parseInt(m[1]), plus: false };
  m = (e.d || "").match(/(\d+) sets x (\d+)/); if (m) return { reps: parseInt(m[2]), plus: false };
  return { reps: 5, plus: false };
}
function startWorkout(di){
  const sess = plannedFor(new Date(di + "T12:00:00")); if (!sess) return;
  PL = { di, sess, i: 0, set: 0, logs: sess.ex.map(e => ({ n: e.n, sets: [] })) };
  $("#player").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  renderPlayer();
}
function closePlayer(){
  $("#player").classList.add("hidden");
  document.body.style.overflow = "";
  if (plTimer) { clearInterval(plTimer); plTimer = null; }
  PL = null;
}
function renderPlayer(){
  const { sess, i, set } = PL;
  const ex = sess.ex[i];
  const t = parseReps(ex);
  const w = parseW(ex);
  const isLastEx = i === sess.ex.length - 1, isLastSet = set === ex.sets - 1;
  const vid = vidFor(ex);
  $("#player").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="tag">${sess.title}</span>
      <button class="btn small ghost" onclick="closePlayer()">✕ Exit</button>
    </div>
    <div class="note" style="margin-top:10px">Exercise ${i+1} of ${sess.ex.length}</div>
    <h2 style="font-size:30px;margin:4px 0 6px">${ex.n}</h2>
    <div style="font-size:15.5px;color:var(--muted);white-space:pre-line">${ex.d}</div>
    ${vid ? `<iframe width="100%" height="190" style="border:0;border-radius:12px;margin-top:12px" src="https://www.youtube-nocookie.com/embed/${vid}" allowfullscreen></iframe>` : ""}
    ${ex.sets > 0 ? `
    <div style="text-align:center;margin-top:22px">
      <div class="note">SET</div>
      <div class="bigset">${set+1} <span style="color:var(--muted);font-size:30px">/ ${ex.sets}</span></div>
      ${w ? `<div style="font-size:24px;font-weight:800;margin-top:6px">${w} lb</div><div class="note">Plates per side: ${plateCalc(w)}</div>` : ""}
      <div style="margin-top:16px">
        <label class="lbl">Reps you got${t.plus && isLastSet ? " (PLUS set — max strong reps)" : ""}</label>
        <input type="number" id="pl-reps" value="${t.reps}" style="max-width:110px;text-align:center;font-size:20px;font-weight:800;margin:0 auto">
      </div>
      <div id="pl-rest" style="font-size:20px;font-weight:800;color:var(--volt);min-height:26px;margin-top:12px"></div>
      <button class="btn" style="width:100%;margin-top:10px;font-size:19px;padding:16px" onclick="playerSetDone()">${isLastEx && isLastSet ? "Finish Workout ✓" : "Set Done ✓"}</button>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn small ghost" style="flex:1" onclick="playerNav(-1)">← Prev</button>
        <button class="btn small ghost" style="flex:1" onclick="playerSkip()">Skip exercise</button>
        <button class="btn small ghost" style="flex:1" onclick="playerNav(1)">Next →</button>
      </div>
    </div>` : `<button class="btn" style="width:100%;margin-top:18px" onclick="playerSkip()">${isLastEx ? "Finish Workout ✓" : "Done — Next"}</button>`}`;
}
function playerRest(sec){
  const el = $("#pl-rest"); if (!el) return;
  let left = sec;
  el.textContent = "Rest " + Math.floor(left/60) + ":" + String(left%60).padStart(2,"0");
  if (plTimer) clearInterval(plTimer);
  plTimer = setInterval(() => {
    left--;
    const e2 = $("#pl-rest"); if (!e2) { clearInterval(plTimer); return; }
    if (left <= 0) { e2.textContent = "GO — next set"; clearInterval(plTimer); if (navigator.vibrate) navigator.vibrate(200); return; }
    e2.textContent = "Rest " + Math.floor(left/60) + ":" + String(left%60).padStart(2,"0");
  }, 1000);
}
function playerSetDone(){
  const ex = PL.sess.ex[PL.i];
  const reps = parseInt(($("#pl-reps") || {}).value) || parseReps(ex).reps;
  PL.logs[PL.i].sets.push({ w: parseW(ex), reps });
  if (PL.set < ex.sets - 1) { PL.set++; renderPlayer(); playerRest(PL.i === 0 ? 180 : 90); }
  else if (PL.i < PL.sess.ex.length - 1) { PL.i++; PL.set = 0; renderPlayer(); }
  else finishWorkout();
}
function playerNav(dir){
  const ni = PL.i + dir;
  if (ni < 0 || ni >= PL.sess.ex.length) return;
  PL.i = ni; PL.set = 0; renderPlayer();
}
function playerSkip(){
  if (PL.i < PL.sess.ex.length - 1) { PL.i++; PL.set = 0; renderPlayer(); }
  else finishWorkout();
}
function e1rm(w, reps){ return w ? Math.round(w * (1 + reps / 30)) : 0; }
function finishWorkout(){
  S.logs = S.logs || {};
  S.logs[PL.di] = PL.logs.filter(l => l.sets.length);
  const mk = ensureMark(PL.di); mk.sets = mk.sets || {};
  PL.sess.ex.forEach((ex, ei) => { if (ex.sets) mk.sets[ei] = Array.from({length: ex.sets}, () => true); });
  save();
  let bump = "";
  PL.logs.forEach((l, li) => {
    const ex = PL.sess.ex[li];
    if (!ex || !l.sets.length) return;
    const t = parseReps(ex);
    const last = l.sets[l.sets.length - 1];
    if (t.plus && last.reps >= t.reps + 2) {
      const lift = l.n.includes("Squat") ? "squat" : l.n.includes("Bench") ? "bench" : null;
      if (lift) {
        const add = lift === "squat" ? 10 : 5;
        bump = `<div class="card" style="border-color:var(--volt)"><h2>Plus Set Earned It</h2>
          <div class="note">${last.reps} reps on the plus set — 2+ over target. Training max bump earned: ${cap(lift)} ${tm(lift)} → ${tm(lift) + add} lb.</div>
          <button class="btn" style="margin-top:10px" onclick="applyBump('${lift}', ${add})">Apply +${add} lb</button></div>`;
      }
    }
  });
  const totalSets = PL.logs.reduce((a, l) => a + l.sets.length, 0);
  const di = PL.di;
  $("#player").innerHTML = `
    <div style="text-align:center;margin-top:30px">
      <div style="font-size:54px">🏆</div>
      <h2 style="font-size:30px">Workout Complete</h2>
      <div class="note">${totalSets} sets logged and saved to your history. All sets on today's card are checked off.</div>
    </div>
    ${bump}
    <button class="btn" style="width:100%;margin-top:14px" onclick="closePlayer(); crossOff('${di}','home');">Cross It Off ✓</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closePlayer(); renderHome();">Back to Today</button>`;
  if (plTimer) { clearInterval(plTimer); plTimer = null; }
}
function applyBump(lift, add){
  S.tm[lift] = tm(lift) + add; save();
  closePlayer(); renderHome(); renderCal();
}

/* ===== History + benchmarks (Progress tab) ===== */
function historyCard(){
  const logs = S.logs || {};
  const dates = Object.keys(logs).sort().reverse();
  if (!dates.length) return `<div class="card"><h2>Top Set History</h2><div class="note">No logged workouts yet. Run a Guided Workout and your top sets, reps and estimated 1RMs will stack up here.</div></div>`;
  const lifts = [["Squat","Back Squat"],["Bench","Bench Press"],["Clean","Hang Clean"]];
  let html = `<div class="card"><h2>Top Set History</h2>`;
  lifts.forEach(([label, match]) => {
    const rows = [];
    dates.forEach(dt => logs[dt].forEach(l => {
      if (l.n.includes(match) && l.sets.length) {
        const best = l.sets.reduce((a, s) => e1rm(s.w, s.reps) > e1rm(a.w, a.reps) ? s : a, l.sets[0]);
        rows.push({ dt, w: best.w, reps: best.reps, e: e1rm(best.w, best.reps) });
      }
    }));
    if (!rows.length) return;
    const bestE = Math.max(...rows.map(r => r.e));
    html += `<div style="margin-top:10px"><b>${label}</b> <span class="note">best est. 1RM: ${bestE} lb</span></div>` +
      rows.slice(0, 4).map(r => `<div class="note" style="margin-top:2px">${r.dt.slice(5)} — ${r.w} lb × ${r.reps} (est. 1RM ${r.e})</div>`).join("");
  });
  return html + `</div>`;
}

<script>
/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
let MONTHS = calMonths();
function calMonths(){ const out = []; const s = new Date(progStart() + "T12:00:00"); s.setDate(1); for(let i = 0; i < 11; i++){ const d = new Date(s); d.setMonth(d.getMonth() + i); out.push(iso(d).slice(0,7)); } return out; }
function mname(k){ const p = k.split("-"); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString("en-US", {month:"long", year:"numeric"}); }
let calIdx = Math.max(0, MONTHS.indexOf(key(new Date())));
let openDate = iso(new Date());
let timerInt = null, timerLeft = 0;

function progressOf(m){
  const lat = parseFloat(S.latest[m.k]);
  if(isNaN(lat)) return null;
  const p = m.up? (lat - m.base)/(m.goal - m.base) : (m.base - lat)/(m.base - m.goal);
  return Math.max(0, Math.min(1, p));
}
function overallProgress(){
  let tot = 0, wsum = 0;
  METRICS.forEach(m => { const p = progressOf(m); tot += (p === null ? 0 : p) * m.w; wsum += m.w; });
  return wsum ? tot / wsum : 0;
}
function streaks(){
  let total = 0; const today = new Date(); let cur = 0, run = true;
  for(let i=0;i<300;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const k = iso(d); const sess = sessionFor(d);
    if(!sess) continue;
    if(S.marks[k] && S.marks[k].done){ total++; if(run) cur++; }
    else if(i>0 && run){ if(!(i===0)) run=false; }
    if(i===0 && !(S.marks[k]&&S.marks[k].done)) run = true; // today not done yet doesn't break streak
    if(i>0 && !(S.marks[k]&&S.marks[k].done)) run = false;
  }
  return {total, cur};
}
function refreshGoal(){
  const p = Math.round(overallProgress()*100);

}

      <p><b>Injury risk:</b> in a published study of adolescent athletes, sleeping under 8 hours a night came with roughly <b>1.7x the injury rate</b>. Sleep is injury prevention.</p>

    <div class="card"><h2>Plate Calculator</h2>
      <p class="rules">45 lb bar. Type the weight you need — it shows the plates for ONE side.</p>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
        <input type="number" id="plate-in" placeholder="e.g. 325" oninput="plateOut()" style="max-width:130px">
        <div id="plate-out" style="font-weight:700"></div>
      </div></div>
    <div class="card"><h2>Account &amp; Cloud Sync</h2><div id="fb-box">${fbBoxHTML()}</div></div>
    <div class="card"><h2>Program Start</h2><div class="rules">
      <p>The whole offseason — recovery weeks, the monthly weight waves, testing days — is anchored to the <b>first Monday after the season ends</b>. Season still going? Push this date out and every week slides with it.</p>
      <p>Current start: <b>${fmtD(progStart())}</b></p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
        <input type="date" id="prog-start" value="${progStart()}">
        <button class="btn small" onclick="saveProgStart()">Save start date</button>
      </div></div></div>
    <div class="card"><h2>Backup / Share Progress</h2>
      <p class="rules">When you are signed in above, progress syncs to the cloud automatically. Export a backup file anytime as an extra copy.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn small" onclick="exportData()">Export backup</button>
        <label class="btn small ghost" style="margin:0">Import backup<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
      </div></div>`;
}

/* ============ ACTIONS ============ */
function ensureMark(di){ if(!S.marks[di]) S.marks[di] = {}; return S.marks[di]; }
function toggleSet(di, exIdx, sIdx){
  const mk = ensureMark(di); mk.sets = mk.sets || {}; mk.sets[exIdx] = mk.sets[exIdx] || [];
  mk.sets[exIdx][sIdx] = !mk.sets[exIdx][sIdx]; save();
  const view = !$("#view-cal").classList.contains("hidden")? "cal" : "home";
  if(view==="cal") renderCal(); else renderHome();
  startTimer(di, 180);
}
function crossOff(di, where){ const mk = ensureMark(di); mk.done = 1; mk.where = where; saveNoteVal(di); rerender(); refreshGoal(); }
function uncross(di){ const mk = ensureMark(di); delete mk.done; delete mk.where; save(); rerender(); refreshGoal(); }
function saveNoteVal(di){ const el = document.getElementById("note-"+di); if(el){ ensureMark(di).note = el.value; save(); } }
function saveNote(di){ saveNoteVal(di); alert("Note saved."); }
function rerender(){ if(!$("#view-cal").classList.contains("hidden")) renderCal(); else renderHome(); }
function openDay(di){ openDate = di; renderCal(); const el = $("#calDay"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }
function moveCal(n){ calIdx = Math.max(0, Math.min(MONTHS.length-1, calIdx+n)); renderCal(); }
function saveLatest(k){ const v = parseFloat(document.getElementById("lat-"+k).value); if(!isNaN(v)) S.latest[k] = v; else delete S.latest[k]; save(); renderProgress(); refreshGoal(); }
function saveFrame(){ S.frame = { h: $("#fr-h").value, w: $("#fr-w").value, wt: $("#fr-wt").value }; save(); alert("Frame saved."); }
function saveTMs(){ S.tm = { squat: parseInt($("#tm-squat").value)||TM0.squat, bench: parseInt($("#tm-bench").value)||TM0.bench, clean: parseInt($("#tm-clean").value)||TM0.clean }; save(); alert("Maxes saved — workouts rebuilt."); }
function startTimer(di, secs){
  stopTimer(); timerLeft = secs;
  const box = document.getElementById("timer-"+di); if(!box) return;
  box.classList.add("show"); tick(di);
  timerInt = setInterval(()=>{ timerLeft--; tick(di); if(timerLeft<=0) stopTimer(di); }, 1000);
}
function tick(di){ const el = document.getElementById("t-"+di); if(el) el.textContent = Math.floor(timerLeft/60)+":"+String(timerLeft%60).padStart(2,"0"); }
function stopTimer(di){ if(timerInt) clearInterval(timerInt); timerInt = null; if(di){ const b = document.getElementById("timer-"+di); if(b) b.classList.remove("show"); } }
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "road-to-d1-progress.json"; a.click();
}
function importData(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ S = JSON.parse(r.result); save(); renderHome(); renderProgress(); refreshGoal(); alert("Backup loaded."); }catch(e){ alert("That file didn't load."); } };
  r.readAsText(f);
}
document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    ["home","cal","progress","meals","playbook"].forEach(v=>$("#view-"+v).classList.add("hidden"));
    $("#view-"+b.dataset.v).classList.remove("hidden");
    if(b.dataset.v==="home") renderHome();
    if(b.dataset.v==="cal") renderCal();
    if(b.dataset.v==="progress") renderProgress();
    if(b.dataset.v==="meals") renderMeals();
    if(b.dataset.v==="playbook") renderPlaybook();
    window.scrollTo({top:0});
  });
});

/* ============ PROGRAM START ACTION ============ */
function saveProgStart(){
  const v = (document.getElementById("prog-start") || {}).value;
  if(!v) return;
  S.progStart = iso(weekMonday(new Date(v + "T12:00:00")));
  save();
  MONTHS = calMonths(); calIdx = Math.max(0, MONTHS.indexOf(key(new Date())));
  renderPlaybook(); renderCal(); renderHome();
  alert("Program now starts " + fmtD(progStart()) + " — every week slid to match.");
}

/* ============ CLOUD SYNC (Firebase) ============ */
/* FIREBASE CONFIG — filled in when the project is ready */
const firebaseConfig = { apiKey: "AIzaSyCoSlthSLQZbDsFDiluQBWMynx9Ih4CchY", authDomain: "road-to-d1.firebaseapp.com", projectId: "road-to-d1", storageBucket: "road-to-d1.firebasestorage.app", messagingSenderId: "38066448182", appId: "1:38066448182:web:f28620e5cba9c1c9acf597" };
let fbUser = null, fbDb = null, fbInit = false, fbPushTimer = null;
let fbStatusMsg = "Not signed in — data lives on this device only.";
function fbTime(){ return new Date().toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"}); }
function fbSetStatus(m){ fbStatusMsg = m; const el = document.getElementById("fb-status"); if(el) el.textContent = m; }
function shouldAdopt(remote){ return (remote._u || 0) > (S._u || 0); }
function cloudPush(){ if(!fbUser || !fbDb) return; clearTimeout(fbPushTimer); fbPushTimer = setTimeout(cloudPushNow, 700); }
function cloudPushNow(){
  if(!fbUser || !fbDb) return;
  if(!S._u){ S._u = Date.now(); localStorage.setItem(LS, JSON.stringify(S)); }
  const data = JSON.parse(JSON.stringify(S));
  fbDb.collection("family").doc("jake").set(data)
    .then(() => fbSetStatus("Synced · " + fbTime()))
    .catch(() => fbSetStatus("Offline — saved on this device, will sync when back online."));
}
function fbAdopt(remote){
  S = remote;
  S.marks = S.marks || {}; S.latest = S.latest || {}; S.tm = S.tm || {}; S.frame = S.frame || {};
  S.fuel = S.fuel || {}; S.readiness = S.readiness || {}; S.logs = S.logs || {}; S.avoids = S.avoids || [];
  S.schoolLog = S.schoolLog || {}; S.schoolWeeks = S.schoolWeeks || {};
  localStorage.setItem(LS, JSON.stringify(S));
  MONTHS = calMonths(); calIdx = Math.max(0, Math.min(MONTHS.length - 1, MONTHS.indexOf(key(new Date()))));
  rerender(); renderProgress(); refreshGoal();
}
function fbBoxHTML(){
  if(fbUser) return `<div class="rules">
    <p>Signed in as <b>${fbUser.email}</b> — this account can view AND edit. Every save syncs to the cloud automatically, and changes from the other device show up here.</p>
    <p id="fb-status" style="margin-top:6px">${fbStatusMsg}</p>
    <button class="btn small ghost" style="margin-top:8px" onclick="fbSignOut()">Sign out</button></div>`;
  return `<div class="rules">
    <p>Sign in once on each phone and Jake's data syncs between them — nothing is lost if a phone is replaced. Jake uses <b>jakem8764@gmail.com</b>, Dad uses <b>johnmorris560@gmail.com</b>, Mom uses <b>jenny.clary@gmail.com</b>. First time on this device? Tap <b>Create account</b> and pick your own password. (Any other email can create an account, but the database refuses it — only these three can open the data.)</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      <input type="email" id="fb-email" placeholder="Email" autocomplete="email">
      <input type="password" id="fb-pass" placeholder="Password" autocomplete="current-password">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn small" onclick="fbSignIn()">Sign in</button>
        <button class="btn small ghost" onclick="fbSignUp()">Create account</button>
      </div>
      <div id="fb-err" style="color:var(--orange);font-weight:700"></div>
      <p id="fb-status">${fbStatusMsg}</p>
    </div></div>`;
}
function fbCreds(){ return { e: ((document.getElementById("fb-email") || {}).value || "").trim().toLowerCase(), p: (document.getElementById("fb-pass") || {}).value || "" }; }
function fbErr(err){ const el = document.getElementById("fb-err"); if(el) el.textContent = err.message; }
function fbSignIn(){ const c = fbCreds(); if(!c.e || !c.p){ fbErr({message:"Enter email and password."}); return; } firebase.auth().signInWithEmailAndPassword(c.e, c.p).catch(fbErr); }
function fbSignUp(){ const c = fbCreds(); if(!c.e || !c.p){ fbErr({message:"Enter email and password."}); return; } firebase.auth().createUserWithEmailAndPassword(c.e, c.p).catch(fbErr); }
function fbSignOut(){ firebase.auth().signOut(); }
function fbSubscribe(){
  fbDb.collection("family").doc("jake").onSnapshot(snap => {
    if(!snap.exists){
      fbInit = true;
      const has = Object.keys(S.marks || {}).length || Object.keys(S.logs || {}).length || Object.keys(S.latest || {}).length;
      if(has) cloudPushNow(); else fbSetStatus("Signed in — cloud is empty, this device starts the record.");
      return;
    }
    const remote = snap.data();
    if(!fbInit){
      fbInit = true;
      if((remote._u || 0) >= (S._u || 0)) fbAdopt(remote); else cloudPushNow();
      fbSetStatus("Synced · " + fbTime());
      return;
    }
    if(shouldAdopt(remote)){ fbAdopt(remote); fbSetStatus("Updated from the other device · " + fbTime()); }
  }, () => fbSetStatus("Sync paused — working on this device, will retry."));
}
function fbInitApp(){
  if(firebaseConfig.apiKey.indexOf("REPLACE") === 0){ fbSetStatus("Sync isn't switched on yet — data lives on this device only."); return; }
  try{
    if(typeof firebase === "undefined"){ fbSetStatus("Sync library didn't load — app works on this device only."); return; }
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
    firebase.auth().onAuthStateChanged(u => {
      fbUser = u;
      if(u){ fbSetStatus("Signed in as " + u.email + " — syncing…"); fbSubscribe(); }
      else { fbInit = false; fbSetStatus("Not signed in — data lives on this device only."); }
      if(!$("#view-playbook").classList.contains("hidden")) renderPlaybook();
    });
  }catch(e){ fbSetStatus("Sync unavailable — app works on this device only."); }
}
fbInitApp();

renderHome(); refreshGoal();
</script>
